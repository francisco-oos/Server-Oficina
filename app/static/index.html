<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Server Oficina</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!--
  Estructura de la interfaz.

  La navegación es doble, tal como exige el encargo: por ÁREA en la barra
  lateral (RRHH trabaja desde RRHH, Transporte desde Transporte) y TRANSVERSAL
  mediante el buscador de la cabecera, que localiza persona, nodo, radio,
  teléfono, unidad, IMEI, QR, serie o número económico y abre la ficha que
  corresponde a cada uno.

  El menú lateral se construye en JavaScript a partir de los permisos del
  usuario: aquí sólo queda el contenedor. Mostrar entradas que después dan 403
  sería un mal trato al operador de campo.
-->
<div id="setup" class="center hidden">
  <form id="setupForm" class="card auth">
    <div class="auth-mark">SO</div>
    <h1>Server Oficina</h1>
    <p>Configuración inicial del servidor operativo</p>
    <input name="display_name" placeholder="Nombre del administrador" minlength="2" required autocomplete="name">
    <input name="username" placeholder="Usuario" minlength="3" required autocomplete="username">
    <input name="password" type="password" placeholder="Contraseña (mín. 10 caracteres)" minlength="10" required autocomplete="new-password">
    <button>Crear administrador</button>
    <div class="msg"></div>
  </form>
</div>

<div id="login" class="center hidden">
  <form id="loginForm" class="card auth">
    <div class="auth-mark">SO</div>
    <h1>Server Oficina</h1>
    <p>Adquisición de Datos · Control operativo</p>
    <input name="username" placeholder="Usuario" required autocomplete="username">
    <input name="password" type="password" placeholder="Contraseña" required autocomplete="current-password">
    <button>Entrar</button>
    <div class="msg"></div>
  </form>
</div>

<div id="app" class="hidden shell">
  <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">SO</div>
      <div><strong>Server Oficina</strong><small id="versionTag">Tracking Core</small></div>
    </div>
    <nav id="nav"></nav>
    <div class="user">
      <span id="who"></span>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </div>
  </aside>
  <div id="scrim" class="scrim hidden"></div>
  <main>
    <header>
      <div class="header-title">
        <div class="eyebrow" id="eyebrow">CONTROL OPERATIVO</div>
        <h1 id="title">Vista resumen</h1>
      </div>
      <form id="globalSearch" class="global-search" role="search">
        <input id="globalSearchInput" type="search" placeholder="Buscar persona, nodo, radio, unidad, serie, IMEI, QR…"
               aria-label="Búsqueda transversal" autocomplete="off">
        <button type="submit" class="secondary">Buscar</button>
      </form>
    </header>
    <section id="content" aria-live="polite"></section>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
