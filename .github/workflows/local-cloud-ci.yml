name: Server Oficina CI

on:
  pull_request:
  push:
    branches:
      - "agent/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Sintaxis
        run: python scripts/syntax-check.py
      - name: Pruebas
        run: python -m pytest -q
      # Mismo contrato que VALIDAR_SERVER_OFICINA.sh / INSTALAR_EN_TABLETA.sh:
      # un CI verde no puede coexistir con un paquete que el instalador rechaza.
      - name: Contrato de paquete (frontend, despliegue, MANIFEST)
        run: |
          ./scripts/verify-frontend.sh
          ./scripts/verify-deploy.sh
          ./scripts/generate-manifest.sh --check
