[pytest]
# -p no:cacheprovider evita que pytest escriba .pytest_cache/ dentro del árbol
# de código. Es necesario para validar una release instalada en modo sólo
# lectura (por ejemplo /opt/server-oficina/current). Para usar --lf/--cache-show
# en desarrollo: pytest -p cacheprovider -o cache_dir=/ruta/escribible
addopts = -q -p no:cacheprovider
testpaths = tests
